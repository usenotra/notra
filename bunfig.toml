[install]
linkWorkspacePackages = false
# Only install package versions published at least 7 days ago
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  # Turbo requires the matching native binary on each build platform.
  "turbo",
  "@turbo/darwin-64",
  "@turbo/darwin-arm64",
  "@turbo/linux-64",
  "@turbo/linux-arm64",
  "@turbo/windows-64",
  "@turbo/windows-arm64",
  "@base-ui/react",
  "@next/env",
  "@next/swc-darwin-arm64",
  "@next/swc-darwin-x64",
  "@next/swc-linux-arm64-gnu",
  "@next/swc-linux-arm64-musl",
  "@next/swc-linux-x64-gnu",
  "@next/swc-linux-x64-musl",
  "@next/swc-win32-arm64-msvc",
  "@next/swc-win32-x64-msvc",
  "@types/react",
  "@types/react-dom",
  "cnfast",
  "next",
  "shadcn",
  "@shadcn/lint",
  "@shadcn/react",
  "eve",
  "ai",
  "@tanstack/react-query",
  "@tanstack/react-query-devtools",
  "@tanstack/query-core",
  "@tanstack/query-devtools",
  "@tanstack/react-db",
  "@tanstack/query-db-collection",
  "@tanstack/db",
  "react-email",
  "@ai-sdk/gateway",
  "@ai-sdk/provider",
  "@ai-sdk/provider-utils",
  # The AI SDK train moves together: code-mode pins the exact `ai` version.
  "@ai-sdk/code-mode",
  "@ai-sdk/react",
  "@ai-sdk/mcp",
  "@ai-sdk/otel",
  "@ai-sdk/openai",
  "@ai-sdk/anthropic",
  "@ai-sdk/google",
  "@ai-sdk/perplexity",
  "@ai-sdk/devtools",
  "@tanstack/db-ivm",
  "@usenotra/geo",
  "zod",
]
