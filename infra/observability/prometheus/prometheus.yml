global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki.railway.internal:3100"]
  - job_name: collector
    static_configs:
      - targets: ["otel-collector.railway.internal:8888"]
  - job_name: application-metrics
    static_configs:
      - targets: ["otel-collector.railway.internal:8889"]
  - job_name: blackbox
    static_configs:
      - targets: ["blackbox.railway.internal:9115"]
  - job_name: vercel
    static_configs:
      - targets: ["vercel-metrics.railway.internal:9091"]
  - job_name: http-probes
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://www.usenotra.com
          - https://app.usenotra.com
          - https://api.usenotra.com/ping
          - https://ingest.usenotra.com/readyz
          - https://mcp.usenotra.com/.well-known/oauth-protected-resource
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox.railway.internal:9115
