name: Agent boot

# Agent deploys are manual, so a packaging regression would otherwise surface
# only when someone deploys. This builds the eve agent and boots it under Node
# with require(esm) disabled, which matches how the Vercel runtime loads it.

on:
  pull_request:
    paths:
      - "apps/agent/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/agent-boot.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/agent/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/agent-boot.yml"

permissions:
  contents: read

concurrency:
  group: agent-boot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install agent dependencies
        working-directory: apps/agent
        run: bash -c "$(bun -p 'require("./vercel.json").installCommand')"

      - name: Build agent
        working-directory: apps/agent
        run: bun run build

      - name: Boot agent and check health
        working-directory: apps/agent
        run: |
          PORT=3200 node --no-experimental-require-module .output/server/index.mjs > boot.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3200/eve/v1/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Agent did not become healthy"
          cat boot.log
          exit 1
