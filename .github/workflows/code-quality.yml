name: Code quality

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notra_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notra_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Check Vercel installs
        run: |
          for app in dashboard web ui agent onboarding-agent; do
            echo "::group::Check $app Vercel install"
            (
              cd "apps/$app"
              bash -c "$(bun -p 'require("./vercel.json").installCommand')"
            )
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate migration journal
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run db:check --base="$MIGRATION_BASE_REF"

      - name: Replay migrations and verify rerun safety
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notra_migrations
        run: |
          bun run db:migrate
          bun run db:migrate

      - name: Run ultracite check
        run: bun check

      - name: Install dashboard browser test runtime
        working-directory: apps/dashboard
        run: bun run playwright install --with-deps chromium

      - name: Run unit and integration tests
        run: bun run test --force

      - name: Verify production markdown endpoints
        run: |
          bun run build --filter=web
          cd apps/web
          bun run test:production

      - name: Restore incremental TypeScript state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/*/.cache/typecheck.tsbuildinfo
            packages/*/.cache/typecheck.tsbuildinfo
          key: typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/typescript-config/*.json') }}-${{ github.sha }}
          restore-keys: |
            typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/typescript-config/*.json') }}-

      - name: Typecheck tested packages and UI docs
        run: bun run check-types --filter=@usenotra/geo --filter=@notra/agent --filter=@notra/ai --filter=@notra/geo-core --filter=dashboard --filter=ui --filter=web
